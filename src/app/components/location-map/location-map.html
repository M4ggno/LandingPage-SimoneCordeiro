<section class="bg-marfim px-6 py-16 md:py-24">
  <div appAnimateOnScroll class="max-w-4xl mx-auto">

    <div class="anim-item flex items-center gap-3 mb-4 justify-center md:justify-start" style="--delay: 0ms">
      <span class="w-8 h-px bg-champagne"></span>
      <p class="font-corpo text-taupe tracking-widest text-xs uppercase">
        Onde estamos
      </p>
    </div>

    <h2 class="anim-item font-titulo text-marrom text-3xl md:text-4xl leading-tight mb-4 text-center md:text-left" style="--delay: 100ms">
      Atendimento presencial
    </h2>

    <p class="anim-item font-corpo text-taupe text-base leading-relaxed mb-8 text-center md:text-left" style="--delay: 200ms">
      {{ profile.clinica }} — {{ profile.cidade }}
    </p>

    <div class="anim-item rounded-2xl overflow-hidden border border-taupe/10 shadow-lg" style="--delay: 300ms">
      <iframe
        [src]="mapUrl"
        width="100%"
        height="400"
        style="border:0;"
        allowfullscreen="true"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    </div>

    <a
      [href]="directionsUrl"
      target="_blank"
      rel="noopener"
      class="anim-item inline-flex items-center gap-2 mt-6 text-marrom font-corpo font-medium hover:text-sage transition-colors duration-300"
      style="--delay: 400ms"
    >
      Abrir localização →
    </a>

  </div>
</section>
