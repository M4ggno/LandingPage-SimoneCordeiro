<footer class="bg-marrom px-6 py-12 md:py-16">
  <div class="max-w-4xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-8">

    <div>
      <img src="icons/logo-SC.svg" alt="Simone Cordeiro" class="h-10 mb-3" width="40" height="40">
      <p class="font-corpo text-marfim/70 text-sm">
        {{ profile.profissao }} · {{ profile.crp }}
      </p>
      <p class="font-corpo text-marfim/50 text-xs mt-1">
        {{ profile.clinica }} — {{ profile.cidade }}
      </p>
    </div>

    <nav class="flex gap-4" aria-label="Links de contato">
      <a [href]="profile.instagramProfissional" target="_blank" rel="noopener" class="footer-icon flex items-center gap-2">
        <img src="icons/instagram.svg" alt="" class="w-5 h-5" width="20" height="20" aria-hidden="true">
        Instagram
      </a>
      <a [href]="profile.lattes" target="_blank" rel="noopener" class="footer-icon flex items-center gap-2">
        <img src="icons/lattes.svg" alt="" class="w-5 h-5" width="20" height="20" aria-hidden="true">
        Lattes
      </a>
      <a [href]="whatsappLink" target="_blank" rel="noopener" class="footer-icon flex items-center gap-2">
        <img src="icons/whatsapp.svg" alt="" class="w-5 h-5" width="20" height="20" aria-hidden="true">
        WhatsApp
      </a>
    </nav>

  </div>

  <div class="max-w-4xl mx-auto mt-8 pt-6 border-t border-marfim/10 text-center">

    <div class="flex flex-row items-center justify-center gap-3 mb-4">
      <a href="https://m4gns.dev" target="_blank" rel="noopener" class="flex items-center gap-1.5 opacity-70 hover:opacity-100 transition-opacity duration-300">
        <span class="font-corpo text-marfim/50 text-xs">Made by</span>
        <img src="icons/m4-dev-icon.svg" alt="M4 dev" class="h-5" width="20" height="20" aria-hidden="true">
      </a>
      <span class="text-marfim/20 text-xs" aria-hidden="true">|</span>
      <a href="https://aureaecosystembiosite.com" target="_blank" rel="noopener" class="flex items-center gap-1.5 opacity-70 hover:opacity-100 transition-opacity duration-300">
        <span class="font-corpo text-marfim/50 text-xs">Powered by</span>
        <img src="icons/aurea-logo-40.webp" alt="Áurea Ecosystem" class="h-5 w-5" width="20" height="20" aria-hidden="true">
      </a>
    </div>

    <p class="font-corpo text-marfim/40 text-xs">
      &copy; {{ currentYear() }} {{ profile.nome }}. Todos os direitos reservados.
    </p>

  </div>
</footer>
