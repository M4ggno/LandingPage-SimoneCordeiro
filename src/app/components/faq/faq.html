<section class="relative bg-marfim px-6 py-16 md:py-24">
  <div appAnimateOnScroll class="max-w-3xl mx-auto">

    <div class="anim-item flex items-center gap-3 mb-4 justify-center md:justify-start" style="--delay: 0ms">
      <span class="w-8 h-px bg-champagne"></span>
      <p class="font-corpo text-taupe tracking-widest text-xs uppercase">
        Dúvidas frequentes
      </p>
    </div>

    <h2 class="anim-item font-titulo text-marrom text-3xl md:text-4xl leading-tight mb-4 text-center md:text-left" style="--delay: 100ms">
      Ainda ficou alguma dúvida?
    </h2>

    <p class="anim-item font-corpo text-taupe text-base leading-relaxed mb-10 text-center md:text-left" style="--delay: 200ms">
      Confira as respostas para algumas das perguntas mais comuns de quem está pensando em iniciar a psicoterapia.
    </p>

    <div class="space-y-3">
      @for (item of perguntas; track item.pergunta; let i = $index) {
        <div class="anim-item border border-taupe/15 rounded-2xl bg-white/60 overflow-hidden" style="--delay: {{ 250 + i * 40 }}ms">
          <button
            (click)="toggle(i)"
            class="w-full flex items-center justify-between gap-4 text-left px-5 py-4 font-corpo font-medium text-marrom"
          >
            <span>{{ item.pergunta }}</span>
            <span class="shrink-0 transition-transform duration-300" [class.rotate-45]="aberto() === i">+</span>
          </button>

          @if (aberto() === i) {
            <div class="px-5 pb-4 font-corpo text-taupe text-sm leading-relaxed">
              {{ item.resposta }}
            </div>
          }
        </div>
      }
    </div>

    <div class="anim-item mt-10 text-center" style="--delay: 400ms">
      <a
        [href]="'https://wa.me/' + profile.whatsapp + '?text=Olá,%20tenho%20uma%20dúvida'"
        target="_blank"
        rel="noopener"
        class="shiny-btn inline-flex items-center justify-center gap-2 bg-sage text-marfim px-6 py-3 rounded-full font-corpo font-medium hover:bg-marrom transition-all duration-300"
      >
        Ainda tenho dúvidas
      </a>
    </div>

  </div>
</section>
